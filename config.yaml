model_list:
  - model_name: orchestrator
    litellm_params:
      model: os.environ/UPSTREAM_ORCHESTRATOR_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: orchestrator-fallback
    litellm_params:
      model: os.environ/UPSTREAM_ORCHESTRATOR_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: worker-explorer
    litellm_params:
      model: os.environ/UPSTREAM_EXPLORER_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/LOCAL_MODEL_TIMEOUT_SECONDS
      num_retries: 0
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Internal fallback
  - model_name: worker-explorer-fallback
    litellm_params:
      model: os.environ/UPSTREAM_EXPLORER_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      num_retries: 0

  - model_name: worker-coder
    litellm_params:
      model: os.environ/UPSTREAM_CODER_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/LOCAL_MODEL_TIMEOUT_SECONDS
      num_retries: 0
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Internal fallback
  - model_name: worker-coder-fallback
    litellm_params:
      model: os.environ/UPSTREAM_CODER_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      num_retries: 0

  - model_name: reviewer
    litellm_params:
      model: os.environ/UPSTREAM_REVIEWER_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: reviewer-fallback
    litellm_params:
      model: os.environ/UPSTREAM_REVIEWER_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: reviewer-specialist
    litellm_params:
      model: os.environ/UPSTREAM_SPECIALIST_REVIEWER_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: reviewer-specialist-fallback
    litellm_params:
      model: os.environ/UPSTREAM_SPECIALIST_REVIEWER_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: coder-specialist-global
    litellm_params:
      model: os.environ/UPSTREAM_GLOBAL_SPECIALIST_CODER_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

  - model_name: coder-specialist-global-fallback
    litellm_params:
      model: os.environ/UPSTREAM_GLOBAL_SPECIALIST_CODER_FALLBACK_MODEL
      custom_llm_provider: openai
      api_base: os.environ/UPSTREAM_LITELLM_URL
      api_key: os.environ/UPSTREAM_LITELLM_API_KEY
      stream_timeout: os.environ/CLOUD_MODEL_TIMEOUT_SECONDS
      num_retries: 0

router_settings:
  fallbacks:
    - orchestrator:
        - orchestrator-fallback
    - worker-explorer:
        - worker-explorer-fallback
    - worker-coder:
        - worker-coder-fallback
    - reviewer:
        - reviewer-fallback
    - reviewer-specialist:
        - reviewer-specialist-fallback
    - coder-specialist-global:
        - coder-specialist-global-fallback
  max_fallbacks: 1
  num_retries: 0
  allowed_fails: 2

litellm_settings:
  telemetry: false

general_settings:
  master_key: os.environ/LOCAL_LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_spend_updates: false
  disable_spend_logs: false
